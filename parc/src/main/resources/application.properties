spring.application.name=parc
server.port=8081

spring.main.banner-mode=off
logging.level.root=WARN

# Base H2 en mémoire, recréée à chaque démarrage.
spring.datasource.url=jdbc:h2:mem:parc;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Durée de la consolidation de l'indice de rotation, en millisecondes.
parc.consolidation-ms=500

# Journalisation
logging.level.hai913i.tp3=INFO
spring.main.log-startup-info=false

logging.structured.format.console=ecs
logging.structured.format.file=ecs
logging.file.name=journaux/parc.log
