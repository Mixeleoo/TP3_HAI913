<section class="actions">

    Lister les produits
  </button>
  <button (click)="voirProduit.emit('P-1002')" [disabled]="enCours()">
    Voir P-1002
  </button>
  <button (click)="voirStock.emit('P-1003')" [disabled]="enCours()">

  </button>
</section>
