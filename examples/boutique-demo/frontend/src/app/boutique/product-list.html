@if (produits().length) {
  <table>
    <thead>
      <tr>
        <th>Référence</th>
        <th>Libellé</th>
        <th>Prix</th>
      </tr>
    </thead>
    <tbody>
      @for (p of produits(); track p.reference) {
        <tr>
          <td>{{ p.reference }}</td>
          <td>{{ p.libelle }}</td>
          <td>{{ p.prix }} €</td>
        </tr>
      }
    </tbody>
  </table>
}
