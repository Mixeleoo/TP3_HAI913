spring.application.name=boutique-backend
server.port=8080

# Bruit de démarrage retiré : la démonstration porte sur les lignes de
# journal applicatives, pas sur l'amorçage de Spring.
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.fr.umontpellier.hai913i.boutique=DEBUG

# Base H2 en mémoire. Elle n'est pas là pour faire joli : l'agent
# OpenTelemetry instrumente le pilote JDBC, et la trace montrera donc une
# requête SQL que personne n'a instrumentée à la main.
spring.datasource.url=jdbc:h2:mem:boutique;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Origine autorisée pour l'interface web (voir ConfigurationCors).
boutique.origine-frontale=http://localhost:4200

# Motif de console. Les deux derniers champs sont le point de la
# démonstration : trace_id et span_id ne sont PAS produits par
# l'application. C'est l'agent OpenTelemetry qui les dépose dans le MDC de
# SLF4J ; sans agent, ils sont vides et le reste de la ligne est inchangé.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{0}] %msg {trace_id=%mdc{trace_id:-} span_id=%mdc{span_id:-}}%n

# Pour la variante structurée, ne rien changer ici : lancer le service avec
#     --logging.structured.format.console=ecs
# Chaque ligne devient alors un objet JSON, trace_id et span_id compris.
