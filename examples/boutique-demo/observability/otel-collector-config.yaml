# OpenTelemetry Collector — configuration de la démonstration du CM 04.
#
# Le Collector n'est pas obligatoire pour faire de l'OpenTelemetry. Il l'est
# devenu ICI, et pour une raison concrète : depuis que le NAVIGATEUR émet lui
# aussi de la télémétrie, il faut un point d'entrée OTLP qui sache répondre à
# une requête de contrôle préalable CORS. Jaeger n'a pas vocation à exposer
# directement un récepteur au navigateur.
#
# Il donne au passage un exemple exécutable de l'architecture enseignée en
# section 7 : recevoir, traiter, exporter.

receivers:
  otlp:
    protocols:
      # Pour le NAVIGATEUR. L'exportateur OTLP/HTTP du navigateur envoie du
      # JSON, ce qui n'est pas un type de contenu « sûr » au sens CORS : une
      # requête OPTIONS de contrôle préalable précède donc chaque envoi, et
      # le Collector doit y répondre. D'où le bloc cors.
      http:
        endpoint: 0.0.0.0:4318
        cors:
          # Origine de l'interface Angular servie par `ng serve`.
          # Volontairement explicite : jamais « * » sur un collecteur, même
          # de démonstration.
          allowed_origins:
            - http://localhost:4200
          max_age: 7200
      # Pour le SERVICE DORSAL. L'agent Java exporte en gRPC par défaut.
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # Un seul traitement, et il est justifié : regrouper les spans en lots
  # réduit le nombre d'envois vers le backend. On n'ajoute pas de
  # processeurs pour faire riche.
  batch:
    timeout: 1s

exporters:
  # Vers Jaeger, en OTLP. L'ancien exportateur « jaeger » a été retiré du
  # Collector : Jaeger accepte OTLP nativement, il n'y a plus de traduction.
  # Le type s'écrit « otlp_grpc » : « otlp » seul est un alias déprécié, et
  # le Collector le signale au démarrage.
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Pour le diagnostic en séance : imprime un résumé des spans reçus.
  # `docker compose logs -f collector` montre alors ce qui entre.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger, debug]
  telemetry:
    logs:
      level: info
