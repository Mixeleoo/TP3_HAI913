# Infrastructure d'observabilité de la démonstration du CM 04.
#
# Seuls le Collector et Jaeger sont conteneurisés. Le service dorsal et
# l'interface web se lancent localement, et c'est un choix pédagogique :
# on veut VOIR l'agent s'attacher à une JVM que l'on démarre soi-même, et
# pouvoir relancer l'application sans toucher à l'infrastructure.
#
# Versions épinglées. Un « latest » rendrait la démonstration irreproductible
# d'une année sur l'autre.

services:
  collector:
    image: otel/opentelemetry-collector:0.162.0
    container_name: cm04-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC — le service dorsal
      - "4318:4318"   # OTLP/HTTP — le navigateur (avec CORS)
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: cm04-jaeger
    ports:
      - "16686:16686"   # interface web
    # Les ports OTLP de Jaeger ne sont PAS publiés sur l'hôte : rien ne doit
    # lui parler directement. Tout passe par le Collector, et c'est la
    # topologie que la section 7 enseigne.
    expose:
      - "4317"
